<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Flappy Bird</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        canvas {
            border: 2px solid black;
            background: skyblue;
        }
    </style>
</head>

<body>
    <h1>Flappy Bird</h1>
    <p>점수: <span id="score">0</span> | 최고기록 :<span id="highScore">0</span></p>
    <p>조작: Space 키 또는 마우스 클릭<button id="restartBtn" onclick="restart(); this.blur();">다시 시작</button></p>
    <canvas id="gameCanvas" width="400" height="500"></canvas>
    
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreText = document.getElementById("score");
        let score = 0;
        let gameOver = false;

        const bird = {
            x: 80, y: 250, radius: 15,
            velocity: 0,
            gravity: 0.3,
            jumpPower: -8
        };

        function drawBird() {
            ctx.beginPath();
            ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
            ctx.fillStyle = "yellow";
            ctx.fill();

            ctx.fillStyle = "black";
            ctx.beginPath();
            ctx.arc(bird.x + 5, bird.y - 5, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        function moveBird() {
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            if (bird.y - bird.radius < 0 || bird.y + bird.radius > canvas.height) {
                endGame();
            }
        }

        function jump() {
            if (gameOver || countdown > 0) return;
            bird.velocity = bird.jumpPower;
        }

        document.addEventListener("keydown", function (event) {
            if (event.code === "Space") {
                event.preventDefault(); // 스페이스바 스크롤 방지
                jump();
            }
        });

        canvas.addEventListener("click", jump);

        let timer = null;

        function restart() {
            if (!gameOver) return;

            bird.y = 250;
            bird.velocity = 0;

            pipes.length = 0;
            coins.length = 0; // 코인 초기화
            score = 0;
            scoreText.textContent = score;
            pipespeed = 3; // 속도 초기화

            if (timer) clearInterval(timer);
            startCountdown();

            gameOver = false;
            gameLoop();
        }

        let countdown = 3;

        function startCountdown() {
            countdown = 3;
            timer = setInterval(function () {
                countdown--;
                if (countdown <= 0) clearInterval(timer);
            }, 1000);
        }

        const pipes = [];
        const coins = []; // [추가] 코인 배열
        const pipeWidth = 60;
        let pipespeed = 3;

        function createPipe() {
            if (countdown > 0 || gameOver) return;

            // [추가/난이도] 파이프 간격(Gap)을 110 ~ 170 사이로 무작위 변경
            const currentGap = Math.floor(Math.random() * 61) + 110;
            const topHeight = Math.random() * 220 + 50;

            pipes.push({
                x: canvas.width,
                topHeight: topHeight,
                bottomY: topHeight + currentGap,
                passed: false
            });

            // [추가] 파이프 생성 시 60% 확률로 중앙에 코인 생성
            if (Math.random() < 0.6) {
                coins.push({
                    x: canvas.width + pipeWidth / 2,
                    y: topHeight + currentGap / 2,
                    radius: 10,
                    collected: false
                });
            }
        }

        function drawPipes() {
            ctx.fillStyle = "green";

            for (let pipe of pipes) {
                ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);
                ctx.fillRect(pipe.x, pipe.bottomY, pipeWidth, canvas.height - pipe.bottomY);
            }

            // [추가] 코인 그리기 (노란색 동전 + 반짝임)
            for (let coin of coins) {
                if (!coin.collected) {
                    ctx.fillStyle = "gold";
                    ctx.beginPath();
                    ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = "orange";
                    ctx.stroke();

                    ctx.fillStyle = "white";
                    ctx.beginPath();
                    ctx.arc(coin.x - 3, coin.y - 3, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function movePipes() {
            // [추가/난이도] 점수가 높아질수록 파이프 속도가 점점 빨라짐 (최대 7까지)
            pipespeed = 3 + Math.floor(score / 5) * 0.5;
            if (pipespeed > 7) pipespeed = 7;

            for (let pipe of pipes) {
                pipe.x -= pipespeed;
                if (!pipe.passed && pipe.x + pipeWidth < bird.x) {
                    score++;
                    scoreText.textContent = score;
                    pipe.passed = true;

                    updateHighScore();
                }
            }

            // [추가] 코인 이동 및 새와 충돌(먹기) 체크
            for (let coin of coins) {
                coin.x -= pipespeed;

                const dist = Math.hypot(bird.x - coin.x, bird.y - coin.y);
                if (!coin.collected && dist < bird.radius + coin.radius) {
                    coin.collected = true;
                    score += 3; // [추가] 코인 먹으면 점수 +3점 추가!
                    scoreText.textContent = score;
                    updateHighScore();
                }
            }

            for (let i = pipes.length - 1; i >= 0; i--) {
                if (pipes[i].x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                }
            }

            for (let i = coins.length - 1; i >= 0; i--) {
                if (coins[i].x + coins[i].radius < 0) {
                    coins.splice(i, 1);
                }
            }
        }

        function checkCollision() {
            for (let pipe of pipes) {
                const birdLeft = bird.x - bird.radius;
                const birdRight = bird.x + bird.radius;
                const birdTop = bird.y - bird.radius;
                const birdBottom = bird.y + bird.radius;

                const pipeLeft = pipe.x;
                const pipeRight = pipe.x + pipeWidth;

                const hitTopPipe = 
                    birdRight > pipeLeft &&
                    birdLeft < pipeRight &&
                    birdTop < pipe.topHeight;

                const hitBottomPipe =
                    birdRight > pipeLeft &&
                    birdLeft < pipeRight &&
                    birdBottom > pipe.bottomY;

                if (hitTopPipe || hitBottomPipe) {
                    endGame();
                }
            }
        }

        function endGame() {
            gameOver = true;
            updateHighScore();

            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = "32px Arial";
            ctx.fillStyle = "white";
            ctx.textAlign = "center";
            ctx.fillText("게임 오버", canvas.width / 2, canvas.height / 2 - 40);
            ctx.font = "20px Arial";
            ctx.fillText("점수 : " + score, canvas.width / 2, canvas.height / 2 + 5);
            ctx.fillText("최고기록 : " + highScore, canvas.width / 2, canvas.height / 2 + 35);
        }

        const highScoreText = document.getElementById("highScore");
        let highScore = Number(localStorage.getItem("flappyHighScore")) || 0;
        highScoreText.textContent = highScore;

        function updateHighScore() {
            if (score > highScore) {
                highScore = score;
                highScoreText.textContent = highScore;
                localStorage.setItem("flappyHighScore", highScore);
            }
        }

        function gameLoop() {
            if (gameOver) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (countdown > 0) {
                drawBird();
                drawPipes();
                ctx.font = "80px Arial";
                ctx.fillStyle = "white";
                ctx.textAlign = "center";
                ctx.fillText(countdown, canvas.width / 2, canvas.height / 2);

                requestAnimationFrame(gameLoop);
                return;
            }
            moveBird();
            movePipes();
            checkCollision();
            drawBird();
            drawPipes();
            requestAnimationFrame(gameLoop);
        }

        setInterval(createPipe, 1500);
        startCountdown();
        gameLoop();

    </script>
</body>

</html>
