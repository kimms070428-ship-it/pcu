<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Pong 게임</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
            background: #f5f5f5;
        }

        canvas {
            border: 2px solid black;
            background: #111;
        }
    </style>
</head>

<body>

    <h1>Pong 게임</h1>
    <p>왼쪽 플레이어: W / S | 오른쪽 플레이어: ↑ / ↓</p>
    <p>왼쪽 점수: <span id="leftScore">0</span> | 오른쪽 점수: <span id="rightScore">0</span></p>

    <canvas id="gameCanvas" width="700" height="400"></canvas>
<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const leftScoreText = document.getElementById("leftScore");
    const rightScoreText = document.getElementById("rightScore");

    let leftScore = 0;
    let rightScore = 0;

    function drawCenterLine() {
        ctx.setLineDash([10,10]);
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2,0);
        ctx.lineTo(canvas.width / 2, canvas.height);
        ctx.strokeStyle = "white";
        ctx.stroke();
        ctx.setLineDash([]);
    }
    drawCenterLine();

    const ball = {
        x: canvas.width/2,
        y: canvas.height/2,
        radius : 10,
        dx: 5,
        dy: 3,
        color: "white" //  공 색상 변수 추가
    };

    function drawBall(){
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
        ctx.fillStyle = ball.color; // 변경된 공 색상 적용
        ctx.fill();
    }

    function moveBall() {
        ball.x += ball.dx;
        ball.y += ball.dy;

        if(ball.y-ball.radius<0 || ball.y+ball.radius > canvas.height){
            ball.dy *= -1;
        }

        if(ball.x-ball.radius <0 ){
            rightScore++;
            rightScoreText.textContent = rightScore;
            resetBall();
        }

        if(ball.x  +ball.radius > canvas.width){
            leftScore++;
            leftScoreText.textContent = leftScore;
            resetBall();
        }

        // 왼쪽 패들 충돌
        if(isBallHitPaddle(leftPaddle)){
            ball.dx = Math.abs(ball.dx) * 1.1; // 튕길 때마다 속도 1.1배가 증가한다
            ball.dy *= 1.1;
            changeBallEffect(); // 크기 및 색상 무작위로 변경한다
        }
        // 오른쪽 패들 충돌
        if(isBallHitPaddle(rightPaddle)){
            ball.dx = -Math.abs(ball.dx) * 1.1; // 튕길 때마다 속도 1.1배 증가한다
            ball.dy *= 1.1;
            changeBallEffect(); //크기 및 색상 무작위로 변경한다
        }

    }

    function changeBallEffect() {
        ball.radius = Math.floor(Math.random() * 21) + 5;
        //  랜덤 색상 부여
        const colors = ["#ff4757", "#2ed573", "#ffa502", "#1e90ff", "#eccc68", "#ff7f50"];
        ball.color = colors[Math.floor(Math.random() * colors.length)];
    }

    function isBallHitPaddle(paddle){
        return (
            ball.x - ball.radius < paddle.x + paddle.width &&
            ball.x + ball.radius > paddle.x &&
            ball.y - ball.radius < paddle.y + paddle.height &&
            ball.y + ball.radius > paddle.y
        );
    }

    const keys = {};

    document.addEventListener("keydown",function(event){
        keys[event.key] = true;
    });
    document.addEventListener("keyup", function(event){
        keys[event.key] = false;
    });

    function movePaddles() {
        if (keys["w"] || keys["W"]){
            leftPaddle.y -= leftPaddle.speed;
        }
        if (keys["s"] || keys["S"]){
            leftPaddle.y += leftPaddle.speed;
        }
        keepPaddleInside(leftPaddle);
    }

    function moveAI() {
        const aicenter = rightPaddle.y + rightPaddle.height/2;
        const speed = 2; 
        
        if(ball.y < aicenter) {
            rightPaddle.y -= speed;
        }
        else{
            rightPaddle.y += speed;
        }
        keepPaddleInside(rightPaddle);

    }

    function keepPaddleInside(paddle){
        if(paddle.y < 0){
            paddle.y = 0;
        }
        if(paddle.y + paddle.height > canvas.height){
            paddle.y = canvas.height -paddle.height;
        }
    }

    function resetBall(){
        ball.x = canvas.width/2;
        ball.y = canvas.height/2;
        ball.dx = (Math.random() > 0.5 ? 5 : -5); // 리셋 시 속도 초기화
        ball.dy = Math.random() *6 -3;
        ball.radius = 10; // 크기 초기화
        ball.color = "white"; // 색상 초기화
        if(ball.dy === 0){
           ball.dy = 2;
        }
    }

    const paddleWidth = 12;
    const paddleHeight = 80;

    const leftPaddle = {
        x:30,
        y:canvas.height/2 - paddleHeight/2,
        width:paddleWidth,
        height:paddleHeight,
        speed:6
    };
    const rightPaddle = {
        x:canvas.width - 30 - paddleWidth,
        y:canvas.height/2 - paddleHeight/2,
        width:paddleWidth,
        height:paddleHeight,
        speed:6
    }

    function drawRect(rect) {
        ctx.fillStyle = "white";
        ctx.fillRect(rect.x, rect.y, rect.width, rect.height);
    }

    function drawGame() {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        drawCenterLine();
        moveBall();
        drawBall();
        movePaddles();
        moveAI();
        drawRect(leftPaddle);
        drawRect(rightPaddle);
        requestAnimationFrame(drawGame);
    }
    drawGame();
</script>
</body>

</html>
