<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>슈팅게임</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        canvas {
            border: 2px solid black;
            background: #111;
        }
    </style>
</head>

<body>
    <h1>Space Shooter</h1>
    <p>점수: <span id="score">0</span> | 생명: <span id="life">3</span></p>
    <p>조작: ← / → 이동, Space 발사</p>
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreText = document.getElementById("score");
        const lifeText = document.getElementById("life");

        let score = 0;
        let life = 3;
        let gameOver = false;

        // [추가] 더블 슈팅 아이템 변수
        let isDoubleShot = false;
        let doubleShotTimer = null;

        const player = {
            x: 280,
            y: 340,
            width: 40,
            height: 40,
            speed: 6
        }

        function drawPlayer() {
            ctx.fillStyle = "deepskyblue";
            ctx.fillRect(player.x, player.y, player.width, player.height);

            ctx.fillStyle = "white"
            ctx.fillRect(player.x + 15, player.y - 10, 10, 10);

        }
        //drawPlayer();
        
        const keys = {};

        document.addEventListener("keydown", function(event){
            keys[event.code] = true;
            if(event.code === "Space"){
                shootBullet();
            }
        });

        document.addEventListener("keyup", function(event){
            keys[event.code] = false;
        });

        function movePlayer() {
            if(keys["ArrowLeft"]) {
                player.x -= player.speed;
            }
            if(keys["ArrowRight"]) {
                player.x += player.speed;
            }
            if(player.x < 0){
                player.x = 0;
            }
            if(player.x + player.width > canvas.width) {
                player.x = canvas.width - player.width;
            }

        }

        const bullets = [];

        // [기능 추가] 더블 슈팅 적용
        function shootBullet() {
            if (isDoubleShot) {
                bullets.push({
                    x: player.x + 5,
                    y: player.y,
                    width: 6,
                    height: 12,
                    speed: 7
                });
                bullets.push({
                    x: player.x + player.width - 11,
                    y: player.y,
                    width: 6,
                    height: 12,
                    speed: 7
                });
            } else {
                bullets.push({
                    x: player.x + player.width / 2 - 3,
                    y: player.y,
                    width: 6,
                    height: 12,
                    speed: 7
                });
            }
        }
        
        function drawBullets(){
            ctx.fillStyle = "yellow";
            
            for(let bullet of bullets){
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            }

        }
        function moveBullets(){
            for(let bullet of bullets){
                bullet.y -= bullet.speed;
            }

            for(let i = bullets.length - 1; i >= 0; i--){
                if(bullets[i].y + bullets[i].height < 0){
                    bullets.splice(i, 1);
                }

            }
        }

        const enemies = [];

        // [기능 추가] 점수에 따른 적 속도 난이도 상승
        function createEnemy(){
            const speedBonus = score * 0.15;

            enemies.push({
                x: Math.random() * (canvas.width - 40),
                y: -40,
                width: 40,
                height: 40,
                speed: (Math.random() * 2 + 2) + speedBonus
            });
        }

        function drawEnemies(){
            ctx.fillStyle = "crimson";

            for(let enemy of enemies){
                ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
            }
        }

        function moveEnemies(){
            for(let enemy of enemies){
                enemy.y += enemy.speed;
            }
            for(let i = enemies.length - 1; i >= 0; i--){
                if(enemies[i].y > canvas.height){
                    enemies.splice(i, 1);
                }
            }

        }

        // [추가] 아이템 배열 및 기능
        const items = [];

        function spawnItem(x, y) {
            if (Math.random() < 0.2) { // 20% 확률로 아이템 드롭
                items.push({
                    x: x + 10,
                    y: y,
                    width: 20,
                    height: 20,
                    speed: 2
                });
            }
        }

        function moveItems() {
            for (let i = items.length - 1; i >= 0; i--) {
                items[i].y += items[i].speed;

                // 아이템 획득 시 더블 슈팅 적용
                if (
                    player.x < items[i].x + items[i].width &&
                    player.x + player.width > items[i].x &&
                    player.y < items[i].y + items[i].height &&
                    player.y + player.height > items[i].y
                ) {
                    items.splice(i, 1);
                    isDoubleShot = true;
                    if (doubleShotTimer) clearTimeout(doubleShotTimer);
                    doubleShotTimer = setTimeout(() => {
                        isDoubleShot = false;
                    }, 7000); // 7초 유지
                    continue;
                }

                if (items[i].y > canvas.height) {
                    items.splice(i, 1);
                }
            }
        }

        function drawItems() {
            ctx.fillStyle = "yellow";
            for (let item of items) {
                ctx.fillRect(item.x, item.y, item.width, item.height);
            }
        }

        //베열(이중반복)
        function checkBulletEnemyCollision(){
            for(let i = enemies.length - 1; i >= 0; i--){
                const enemy = enemies[i];
                for(let j = bullets.length - 1; j >= 0; j--){
                    const bullet = bullets[j];

                    if(bullet.x < enemy.x + enemy.width &&
                        bullet.x + bullet.width > enemy.x &&
                        bullet.y < enemy.y + enemy.height &&
                        bullet.y + bullet.height > enemy.y
                    ){
                        spawnItem(enemy.x, enemy.y); // [추가] 적 처치 시 아이템 생성 검사
                        enemies.splice(i, 1);
                        bullets.splice(j, 1);
                        score++;
                        scoreText.textContent = score;
                        break;
                    }  

                }
            }

        }

        function checkPlayerEnemyCollision(){
            for(let i = enemies.length - 1; i >= 0; i--){
                const enemy = enemies[i];
                if( player.x < enemy.x + enemy.width &&
                    player.x + player.width > enemy.x &&
                    player.y < enemy.y + enemy.height &&
                    player.y + player.height > enemy.y){
                        enemies.splice(i, 1);

                        life--;
                        lifeText.textContent = life;
                        if(life <= 0){
                            endGame();
                        }

                    }

            }

        }

        function endGame() {
            gameOver = true;

            ctx.fillStyle = "rgba(0,0,0,0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = "32px Arial";
            ctx.fillStyle = "white";
            ctx.textAlign = "center";

            ctx.fillText("게임 오버!", canvas.width / 2, canvas.height / 2 - 20);
            ctx.fillText("최종 점수 :" + score, canvas.width / 2, canvas.height / 2 + 30);
        }

        function gameLoop(){

            if(gameOver) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            movePlayer();
            moveBullets();
            moveEnemies();
            moveItems(); // [추가]
            drawPlayer();
            drawBullets();
            drawEnemies();
            drawItems(); // [추가]
            checkBulletEnemyCollision();
            checkPlayerEnemyCollision();

            requestAnimationFrame(gameLoop);

        }
        setInterval(createEnemy, 900);
        gameLoop();

        
    </script>
</body>

</html>
