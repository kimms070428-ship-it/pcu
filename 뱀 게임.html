<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Snake 게임</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        canvas {
            border: 2px solid black;
            background: #f9f9f9;
        }
    </style>
</head>

<body>

    <h1>Snake 게임</h1>
    <p>점수: <span id="score">0</span></p>
    <p>조작: 방향키 ↑ ↓ ← →</p>

    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreText = document.getElementById("score");
        let score = 0;

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x:10, y:10}];

        let food = {x:5, y:5};

        let obstacles = [];
        const obstacleCount = 10; 

        let dx = 1;
        let dy = 0;

        let nextDx = 1;
        let nextDy = 0;

        let gameOver = false;

        function drawTile(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x*gridSize, y*gridSize, gridSize-2, gridSize-2);
        }

        function drawSnake() {
            for(let i = 0; i < snake.length; i++) {
                if(i == 0){
                    drawTile(snake[i].x, snake[i].y, "brown");
                }
                else{
                    drawTile(snake[i].x, snake[i].y, "peru");
                }
            }
        }

        function drawFood() {
            drawTile(food.x, food.y, "red");
        }

        function drawObstacles() {
            for(let i = 0; i < obstacles.length; i++) {
                drawTile(obstacles[i].x, obstacles[i].y, "gray");
            }
        }

        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            if (event.key === "ArrowUp" && dy !== 1) {
                nextDx = 0;
                nextDy = -1;
            }
            if (event.key === "ArrowDown" && dy !== -1) {
                nextDx = 0;
                nextDy = 1;
            }
            if (event.key === "ArrowLeft" && dx !== 1) {
                nextDx = -1;
                nextDy = 0;
            }
            if (event.key === "ArrowRight" && dx !== -1) {
                nextDx = 1;
                nextDy = 0;
            }
        }

        function moveSnake() {
            dx = nextDx;
            dy = nextDy;

            let head = { x: snake[0].x + dx, y: snake[0].y + dy };

            if (head.x < 0) head.x = tileCount - 1;          
            if (head.x >= tileCount) head.x = 0;             
            if (head.y < 0) head.y = tileCount - 1;          
            if (head.y >= tileCount) head.y = 0;             

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreText.textContent = score;
                moveFood();
            } else {
                snake.pop();
            }
        }

        function moveFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
        }

       
        function createObstacles() {
            for(let i = 0; i < obstacleCount; i++) {
                let obs = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
                obstacles.push(obs);
            }
        }

        function checkCollision() {
            const head = snake[0];

        

            
            for(let i = 1; i < snake.length; i++){
                if(head.x === snake[i].x && head.y === snake[i].y){
                    endGame();
                }
            }

            
            for(let i = 0; i < obstacles.length; i++) {
                if(head.x === obstacles[i].x && head.y === obstacles[i].y) {
                    endGame();
                }
            }
        }

        function endGame() {
            gameOver = true;

            ctx.fillStyle = "rgba(0,0,0,0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = "32px Arial";
            ctx.fillStyle = "white";
            ctx.textAlign = "center";

            ctx.fillText("게임 오버", canvas.width/2, canvas.height/2-20);
            ctx.fillText("점수 :" + score, canvas.width/2, canvas.height/2+30);
        }

        function gameLoop() {
            if(gameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            moveSnake();
            checkCollision();
            drawSnake();
            drawObstacles(); 
            drawFood();
        }

      
        createObstacles();
        setInterval(gameLoop, 100);

    </script>

</body>

</html>
